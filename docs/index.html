<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de vendas na nuvem</title>
<style>
:root{--bg:#eef2f3;--card:#fff;--tx:#17252a;--mut:#52666d;--ac:#0e7c86;--btx:#fff;--bd:#d3dde0;--err:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1d;--card:#16252a;--tx:#e6f0f2;--mut:#9db3b9;--ac:#4cc3cd;--btx:#08262a;--bd:#2a3f45;--err:#ff8a80;--ok:#5fd39a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Times New Roman",serif;padding:28px 16px}
main{max-width:680px;margin:0 auto}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 24px;font-family:system-ui,Arial,sans-serif;font-size:.95rem}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;margin-bottom:16px;font-family:system-ui,Arial,sans-serif}
h2{font-size:1.05rem;margin:0 0 12px}
button{background:var(--ac);color:var(--btx);border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:block;margin-bottom:14px;max-width:100%}
#msg{margin-top:12px;min-height:1.5em;overflow-wrap:anywhere}
.err{color:var(--err)}.ok{color:var(--ok)}
.total{font-family:Georgia,serif;font-size:2.6rem;font-weight:700;line-height:1.1;margin:0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.n{text-align:right}
</style>
</head>
<body>
<main>
<h1>Análise de vendas na nuvem</h1>
<p class="sub">Envie um CSV de vendas. A AWS guarda o arquivo no S3 e calcula o relatório com Lambda.</p>

<section>
<h2>1. Enviar arquivo</h2>
<input type="file" id="csv" accept=".csv,text/csv">
<button id="enviar">Enviar CSV</button>
<div id="msg" role="status"></div>
</section>

<section>
<h2>2. Relatório</h2>
<button id="relatorio" disabled>Gerar relatório</button>
<div id="saida" hidden>
<p class="total" id="total"></p>
<div class="wrap"><table>
<thead><tr><th>Produto</th><th class="n">Quantidade</th><th class="n">Receita</th></tr></thead>
<tbody id="linhas"></tbody>
</table></div>
</div>
</section>
</main>

<script>
// Cole aqui as Function URLs das duas Lambdas (sem aspas extras, sem espaços).
const URL_UPLOAD = "https://a6trlnl2vp5hwu6t6vhet5bl7i0xwkrq.lambda-url.us-east-2.on.aws/" ;
const URL_RELATORIO = "https://65cvhyt4tf2itji2vb4g4mmqpe0ikedx.lambda-url.us-east-2.on.aws/";

const $ = id => document.getElementById(id);
const brl = n => Number(n).toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
let arquivoSalvo = null;

function msg(texto, classe) {
  $("msg").textContent = texto;
  $("msg").className = classe || "";
}

async function chamar(url, opcoes) {
  const r = await fetch(url, opcoes);
  let dados = {};
  try { dados = await r.json(); } catch (e) { /* resposta sem JSON */ }
  if (!r.ok) throw new Error(dados.erro || "Falha na requisição (" + r.status + ")");
  return dados;
}

$("enviar").onclick = async () => {
  const f = $("csv").files[0];
  if (!f) return msg("Escolha um arquivo CSV antes de enviar.", "err");
  $("enviar").disabled = true;
  msg("Enviando…");
  try {
    // text/plain evita a verificação prévia de CORS (preflight)
    const d = await chamar(URL_UPLOAD, {method: "POST", headers: {"Content-Type": "text/plain"}, body: await f.text()});
    arquivoSalvo = d.arquivo;
    $("relatorio").disabled = false;
    msg("Arquivo salvo no S3: " + d.arquivo + " (" + d.linhas + " linhas)", "ok");
  } catch (e) {
    msg("Erro: " + e.message, "err");
  } finally {
    $("enviar").disabled = false;
  }
};

$("relatorio").onclick = async () => {
  $("relatorio").disabled = true;
  try {
    const u = new URL(URL_RELATORIO);
    u.searchParams.set("arquivo", arquivoSalvo);
    const d = await chamar(u.toString());
    $("total").textContent = "Total de vendas: " + brl(d.total_vendas);
    const corpo = $("linhas");
    corpo.replaceChildren();
    d.produtos_mais_vendidos.forEach(p => {
      const tr = document.createElement("tr");
      [p.produto, p.quantidade, brl(p.receita)].forEach((v, i) => {
        const td = document.createElement("td");
        td.textContent = v;           // textContent evita injeção de HTML vinda do CSV
        if (i > 0) td.className = "n";
        tr.appendChild(td);
      });
      corpo.appendChild(tr);
    });
    $("saida").hidden = false;
  } catch (e) {
    msg("Erro: " + e.message, "err");
  } finally {
    $("relatorio").disabled = false;
  }
};
</script>
</body>
</html>
